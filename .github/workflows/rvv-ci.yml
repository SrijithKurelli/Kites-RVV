name: RVV build and test

on:
  push:
    branches:
      - rvv/milestone-1
      - rvv/milestone-2-compute-kernels
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rvv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qt-tests:
    name: Linux / Qt 6.9.2 / GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt 6.9.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          install-deps: true

      - name: Install GoogleTest and GoogleMock sources
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libgmock-dev

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          g++ --version
          test -f "${QT_ROOT_DIR}/lib/cmake/Qt6/Qt6Config.cmake"
          test -f /usr/src/googletest/CMakeLists.txt
          echo "Using Qt at ${QT_ROOT_DIR}"
          echo "Using GoogleTest sources at /usr/src/googletest"

      - name: Configure tests
        run: >
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"
          -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=/usr/src/googletest
          -DENABLE_TESTS=ON
          -DDISABLE_GUI=ON
          -DVM_DEBUG_PRINTS=OFF

      - name: Build CLI and test suite
        run: cmake --build build/ci --target kites_cli kites_test --parallel 2

      - name: Smoke-test RVSS vector examples and CLI inspection
        shell: bash
        run: |
          set -euo pipefail
          for example in examples/vector/*.s; do
            echo "::group::Smoke test ${example}"
            output="$(./build/ci/kites-cli "${example}" --vm rvss)"
            printf '%s\n' "$output"
            if [[ "$example" == *vector_average_selected.s ]]; then
              grep -Fq '[Syscall output: 2]' <<< "$output"
            elif [[ "$example" == *vector_dot_product.s ]]; then
              grep -Fq '[Syscall output: 70]' <<< "$output"
            elif [[ "$example" == *vector_cross_product.s ]]; then
              grep -Fq '[Syscall output: -3]' <<< "$output"
              grep -Fq '[Syscall output: 6]' <<< "$output"
            elif [[ "$example" == *vector_matrix_multiply_2x2.s ]]; then
              grep -Fq '[Syscall output: 19]' <<< "$output"
              grep -Fq '[Syscall output: 22]' <<< "$output"
              grep -Fq '[Syscall output: 43]' <<< "$output"
              grep -Fq '[Syscall output: 50]' <<< "$output"
            fi
            echo "::endgroup::"
          done

          repl_input="$(printf '%b' 'info\nregs\nexit\n')"
          repl_output="$(printf '%s' "$repl_input" | ./build/ci/kites-cli examples/vector/vector_load_add_store.s --repl)"
          grep -Fq 'VLEN=128, LMUL=1' <<< "$repl_output"
          grep -Fq 'Vector registers (128-bit):' <<< "$repl_output"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/ci --output-on-failure --parallel 2
